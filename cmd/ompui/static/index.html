<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMultiPath</title>
<style>
  /* Dark, high contrast, large figures. This gets read on a phone, at
     night, by someone who is already annoyed about something. */
  :root {
    --bg: #12151a; --panel: #1a1f27; --line: #2a323d;
    --text: #e6edf3; --dim: #8b98a8;
    --good: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .role { color: var(--dim); font-size: 13px; }
  main { padding: 18px; max-width: 1100px; margin: 0 auto; }
  section { margin-bottom: 26px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }

  /* The staleness banner is the most important thing on the page: every
     other number is only as true as this one is recent. */
  #freshness {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 20px;
    font-weight: 600; border: 1px solid transparent;
  }
  .fresh { background: #10281a; color: var(--good); border-color: #1c4429 !important; }
  .stale { background: #2d1618; color: var(--bad); border-color: #5c2326 !important; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
  .card .value { font-size: 26px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }

  .path {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .path.alive { border-left-color: var(--good); }
  .path.dead  { border-left-color: var(--bad); }
  .path-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .path-name { font-weight: 650; font-size: 16px; }
  .diag { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
          display: flex; flex-direction: column; gap: 10px; }
  .diag-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .diag-btn { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
              border: 1px solid var(--line); background: var(--panel); color: inherit; }
  .diag-btn:hover:not(:disabled) { border-color: var(--accent); }
  .diag-btn:disabled { opacity: 0.6; cursor: default; }
  .diag-result { flex-basis: 100%; margin-top: 4px; }
  .metrics { display: grid; gap: 10px 16px; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); }
  .metric .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; cursor: help; }
  .metric-group { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .metric-group:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
  .metric-group h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }
  .dir { display: inline-block; padding: 0 4px; border-radius: 3px; background: rgba(127,127,127,.18);
         font-size: 9px; letter-spacing: .04em; vertical-align: 1px; }
  .metric .v { font-size: 17px; font-variant-numeric: tabular-nums; margin-top: 1px; }

  .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .tag.good { color: var(--good); border-color: #1c4429; }
  .tag.bad  { color: var(--bad);  border-color: #5c2326; }
  .tag.warn { color: var(--warn); border-color: #4a3a12; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 10px 5px 0; }
  th { color: var(--dim); font-weight: 500; }
  td { font-variant-numeric: tabular-nums; }

  form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .field { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 12px; }
  .field label { font-size: 14px; }
  .field .hint { color: var(--dim); font-size: 12px; grid-column: 1 / -1; margin-top: -6px; }
  input[type=number], select {
    background: #0d1117; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; width: 130px; font: inherit;
    font-variant-numeric: tabular-nums;
  }
  button {
    background: var(--accent); color: #04121f; border: 0; border-radius: 6px;
    padding: 8px 15px; font: inherit; font-weight: 650; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:hover { filter: brightness(1.1); }
  .saved { color: var(--good); font-size: 13px; margin-left: 10px; }

  pre#logs {
    background: #0d1117; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; max-height: 340px; overflow: auto;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #b9c5d3; white-space: pre-wrap; word-break: break-word;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="node">OpenMultiPath</h1>
  <span class="role" id="role"></span>
  <span class="role" id="uptime"></span>
</header>

<main>
  <div id="freshness" class="stale">Waiting for the daemon&hairsp;&hellip;</div>

  <section>
    <h2>Aggregate</h2>
    <div class="cards" id="aggregate"></div>
  </section>

  <section>
    <h2>Scheduling</h2>
    <div id="scheduler"></div>
  </section>

  <section>
    <h2>Paths</h2>
    <div id="paths"></div>
  </section>

  <section>
    <h2>Settings</h2>
    <form id="config">
      <div id="fields"></div>
      <div class="row">
        <button type="submit">Save</button>
        <span class="muted">Applied to the running daemon within a few seconds. Out-of-range values are corrected.</span>
        <span class="saved" id="saved" hidden>Saved</span>
      </div>
    </form>
  </section>

  <section>
    <h2>Daemon log</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="secondary" id="refresh-logs" type="button">Refresh</button>
      <button class="secondary" id="restart" type="button">Restart daemon</button>
      <span class="muted" id="restart-note"></span>
    </div>
    <pre id="logs">Loading&hellip;</pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

// lastState is the most recent snapshot, kept so a bandwidth test can
// re-render the path cards the instant it finishes rather than waiting for
// the next poll. diagRuns holds each path's test state (running / result /
// error) outside the DOM, so the once-a-second rebuild does not wipe it.
let lastState = null;
const diagRuns = {};
const fmt = (n, d = 1) => (n === undefined || n === null) ? "—" : Number(n).toFixed(d);

// Data volumes against a monthly cap. Always two significant figures at
// the scale the cap is written in: somebody watching 94 GB of a 100 GB
// allowance needs the fraction, and somebody at 3 MB does not.
function bytes(n) {
  if (n === undefined || n === null) return "\u2014";
  if (n >= 1e9) return (n / 1e9).toFixed(1) + " GB";
  if (n >= 1e6) return (n / 1e6).toFixed(0) + " MB";
  if (n >= 1e3) return (n / 1e3).toFixed(0) + " kB";
  return n + " B";
}

// The band names map onto the tag colours the rest of the page already
// uses, so a red link reads the same as any other red thing here.
const bandClass = { green: "good", yellow: "warn", red: "bad" };

// What this link has spent, and against what.
//
// An unmetered link still shows its usage: knowing what a link carries is
// what somebody needs in order to decide whether to cap it, and it is
// useful long before anybody does. Only a configured cap gets a band,
// because a band on an uncapped link would be reporting a judgement
// nobody asked for.
function budgetRow(p) {
  const kTitle = "Bytes carried on this physical link during the current billing cycle, " +
    "from kernel interface counters. Tracked whether or not a cap is configured.";
  if (p.used_bytes === undefined || p.used_bytes === null) return "";
  if (!p.budget_metered) {
    return `<div class="metric"><div class="k" title="${kTitle}">This cycle</div>
      <div class="v" title="no allowance configured for this link">${bytes(p.used_bytes)}</div></div>`;
  }
  const cls = bandClass[p.budget] || "good";
  const pct = p.cap_bytes ? Math.round(p.used_bytes / p.cap_bytes * 100) : 0;
  return `<div class="metric"><div class="k" title="${kTitle}">This cycle <span class="tag ${cls}">${p.budget}</span></div>
    <div class="v" title="${pct}% of the allowance used; on course for ${bytes(p.projected_bytes)} by the end of the cycle">${bytes(p.used_bytes)} / ${bytes(p.cap_bytes)}</div></div>`;
}

function duration(sec) {
  if (sec < 60) return Math.round(sec) + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m " + Math.round(sec % 60) + "s";
  const h = Math.floor(sec / 3600);
  return h + "h " + Math.floor((sec % 3600) / 60) + "m";
}

// Bitrates span four orders of magnitude here - a 512k standby tier and a
// 200 Mbps dish are both normal - so they are scaled rather than printed as
// a wall of digits nobody can compare at a glance.
function rate(kbps) {
  if (kbps === undefined || kbps === null) return "—";
  if (kbps >= 1000) return fmt(kbps / 1000, kbps >= 10000 ? 0 : 1) + " Mbps";
  return fmt(kbps, 0) + " kbps";
}

// A path's own loss rate is what decides whether its numbers are worth
// believing, so colour it rather than leaving it as one figure among many.
function lossClass(pct) {
  if (pct >= 2) return "bad";
  if (pct >= 0.5) return "warn";
  return "good";
}

function card(label, value, sub) {
  return `<div class="card"><div class="label">${label}</div>` +
         `<div class="value">${value}</div>` +
         (sub ? `<div class="sub">${sub}</div>` : "") + `</div>`;
}

function renderAggregate(s) {
  const a = s.aggregate;
  const mtuSub = s.recommended_tunnel_mtu
    ? (s.recommended_tunnel_mtu === s.tunnel_mtu
        ? "matches the measured paths"
        : `paths measured at ${s.recommended_tunnel_mtu}`)
    : "paths not yet measured";

  $("aggregate").innerHTML =
    card("Paths alive", `${a.paths_alive}/${a.paths_total}`) +
    card("Loss (recent)", fmt(a.recent_loss_percent, 2) + "%", "last minute") +
    card("Loss (lifetime)", fmt(a.loss_percent, 2) + "%",
         `${a.lost.toLocaleString()} of ${(a.received + a.lost).toLocaleString()}`) +
    card("Best RTT", a.best_rtt_ms ? fmt(a.best_rtt_ms) + " ms" : "—",
         "lowest across live paths") +
    card("Received", a.received.toLocaleString()) +
    card("Tunnel MTU", s.tunnel_mtu || "—", mtuSub);
}

// A path's state is the first thing to read when the choice looks wrong,
// so it gets a colour rather than being one word among many.
function stateClass(state) {
  if (state === "stable") return "good";
  if (state === "unstable") return "warn";
  return "bad";
}

// MOS is the score restated on the 1-to-5 scale people already have
// intuitions about. Anything under 3.6 is the point at which the scheduler
// itself considers a path inadequate.
function mosClass(mos) {
  if (mos >= 4) return "good";
  if (mos >= 3.6) return "warn";
  return "bad";
}

function renderScheduler(s) {
  const sc = s.scheduler || {};
  const named = id => {
    const p = (s.paths || []).find(p => p.id === id);
    return p ? (p.label || p.name || "path " + id) : "path " + id;
  };

  // Blind means the measurements have stopped being able to help and
  // traffic is going everywhere in the hope something gets through. It is
  // the fail-to-a-working-state behaviour and it should be impossible to
  // miss.
  if (sc.blind) {
    $("scheduler").innerHTML =
      `<div class="path dead"><div class="path-head">
         <span class="path-name">No usable path</span>
         <span class="tag bad">sending on everything</span>
       </div>
       <p class="muted">${sc.reason || ""} Every path is down, so traffic is being duplicated across
       every link that is still bound rather than dropped.</p></div>`;
    return;
  }

  if (sc.primary === undefined || sc.primary < 0) {
    $("scheduler").innerHTML = `<p class="muted">No path chosen yet.</p>`;
    return;
  }

  const handover = sc.switching
    ? `<span class="tag warn">handing over to ${named(sc.switching_to)}</span>`
    : "";

  const order = (sc.ranking || []).map((id, i) =>
    `${i + 1}. ${named(id)}`).join("&nbsp; ");

  $("scheduler").innerHTML =
    `<div class="path alive"><div class="path-head">
       <span class="path-name">Carrying traffic on ${named(sc.primary)}</span>
       ${handover}
       <span class="tag">${sc.duplicate_mode || ""}</span>
     </div>
     <p class="muted">${sc.reason || ""}</p>
     ${order ? `<p class="muted">Ranked: ${order}</p>` : ""}
     ${bulkPlacement(s, named)}
     ${classSplit(sc)}
     </div>`;
}

// How bulk is being placed (v0.2). Worth a line of its own next to the path
// choice: "cascade" configured but running as "flow" is the first thing to
// check when downloads do not aggregate, and the reason says why - an older
// peer, no classifier, or blind mode.
function bulkPlacement(s, named) {
  const sc = s.scheduler || {};
  if (!sc.bulk_scheduler) return "";
  const rs = sc.resequencer || {};
  const reseq = rs.reordered || rs.late
    ? ` · resequencer holding ${fmt(rs.hold_ms, 0)} ms, ${(rs.reordered || 0).toLocaleString()} reordered, ${(rs.late || 0).toLocaleString()} late`
    : "";
  if (sc.bulk_scheduler !== "cascade") {
    return `<p class="muted" title="Bulk is placed one flow to one path, v0.1's scheduler.">Bulk: per flow${sc.bulk_scheduler_reason ? ` (${sc.bulk_scheduler_reason})` : ""}${reseq}</p>`;
  }
  const members = (s.paths || [])
    .filter(p => p.cascade_position >= 0)
    .sort((a, b) => a.cascade_position - b.cascade_position)
    .map(p => {
      const cap = p.bulk_cap_kbps > 0 ? `capped ${rate(p.bulk_cap_kbps)}` : "uncapped";
      return `${named(p.id)}${p.cascade_protected ? " (call's path)" : ""} ${cap}`;
    }).join(" → ");
  const dropped = sc.bulk_overflowed ? ` · ${sc.bulk_overflowed.toLocaleString()} past every allowance` : "";
  return `<p class="muted" title="Bulk fills the slowest path first and spills onto faster ones only as each congests, the call's path last. A cap is how much bulk a path may currently take, set from the standing queue and loss the far end reports.">Bulk: cascade ${members}${dropped}${reseq}</p>`;
}

// What the classifier has decided, since the daemon started.
//
// Worth showing next to the path choice rather than buried in the
// metrics: the transactional thresholds are guesses, and this is the only
// place somebody watching the box can see whether they are plausible. A
// split reading zero transactional, or zero bulk, is the detector telling
// you it is not working.
function classSplit(sc) {
  const parts = [
    ["real-time", sc.class_realtime],
    ["transactional", sc.class_transactional],
    ["bulk", sc.class_bulk],
    ["unclassified", sc.class_unknown],
  ].filter(([, n]) => typeof n === "number");
  if (!parts.length) return "";

  const total = parts.reduce((a, [, n]) => a + n, 0);
  if (!total) {
    return `<p class="muted" title="the daemon is below WireGuard, or nothing has been carried yet">Classified: nothing yet</p>`;
  }
  const shown = parts.map(([name, n]) =>
    `${name} ${Math.round(n / total * 100)}%`).join("&nbsp;·&nbsp;");
  return `<p class="muted" title="${total.toLocaleString()} packets since start">Classified: ${shown}</p>`;
}

function renderPaths(s) {
  // base_delay_ms is a fixed non-network budget folded into the scoring
  // delay. It has to be visible, and separable: shown alone the scoring
  // figure looks like a one-way latency that exceeds the round trip, which
  // is how it got queried.
  const cfg = s.config || {};
  if (!s.paths || !s.paths.length) {
    $("paths").innerHTML = `<p class="muted">No paths yet.</p>`;
    return;
  }
  // Only the initiator owns its sockets, so only it can say whether a
  // link is bound. On the responder these fields are absent and the
  // interface must not read that absence as every path being down.
  const owns = s.manages_paths;

  $("paths").innerHTML = s.paths.map(p => {
    // A link that is not bound and a link that is bound but silent are
    // different faults with different fixes - the modem has not come back
    // versus something past it is broken - so they get different words.
    const status = (owns && !p.bound)
      ? `<span class="tag bad">link down</span>`
      : p.alive ? `<span class="tag good">alive</span>`
                : `<span class="tag bad">no traffic</span>`;

    const tags = [
      status,
      p.state ? `<span class="tag ${stateClass(p.state)}">${p.state}${p.state_reason ? " · " + p.state_reason : ""}</span>` : "",
      p.primary ? `<span class="tag good">primary</span>`
                : p.sending ? `<span class="tag">sending</span>` : "",
      p.flapping ? `<span class="tag bad">flapping</span>` : "",
      p.thin ? `<span class="tag warn">thin statistics</span>` : "",
      p.tx_reported ? "" : `<span class="tag warn" title="the far end is not reporting on this path, so it is being scored on half a round trip and on inbound measurements - the wrong direction for a send decision">no outbound report</span>`,
      (p.path_mtu && !p.usable) ? `<span class="tag bad">below tunnel floor</span>` : "",
      (owns && p.local) ? `<span class="tag">via ${p.local}</span>` : "",
      p.remote ? `<span class="tag">${p.remote}</span>` : "",
    ].join(" ");

    // Score differing from the raw quality figure is the visible evidence
    // of a penalty: a healthy R with a poor score means the path is being
    // held back for its history, not for its current measurements.
    const penalty = (p.r_factor - p.score) >= 1
      ? `penalised ${fmt(p.r_factor - p.score, 0)} R` : "raw quality";

    // Capacity. limit_kbps - the ceiling discounted for how long it has
    // gone unconfirmed - is the only bandwidth figure the scheduler itself
    // ever acts on (D-049), so it is the only one shown: a number the
    // interface trusts more than the code does would be worse than no
    // number at all. No ceiling ever observed means no opinion, shown as
    // "unknown" rather than a floor from clean carriage that could as
    // easily have been one lucky burst as real sustained capacity.
    const capacity = p.ceiling_known ? rate(p.limit_kbps) : "unknown";

    // What ages is the confidence, never the value: an idle hour is not
    // evidence that a link shrank. The undiscounted ceiling and the
    // discount currently applied are both shown, rather than folded
    // silently into the headline.
    const capacityNote = p.ceiling_known
      ? (p.limit_kbps < p.ceiling_kbps * 0.99
          ? `ceiling ${rate(p.ceiling_kbps)} measured ${duration(p.ceiling_age_seconds)} ago; discounted to ${rate(p.limit_kbps)} while it goes unconfirmed`
          : `ceiling measured ${duration(p.ceiling_age_seconds)} ago, where queueing set in, at full confidence`)
      : "nothing has ever loaded this path enough to see where it queues, so nothing is assumed about what it can carry";

    // Inbound and outbound are labelled apart because they are measured in
    // different places and routinely disagree. Everything unlabelled is
    // measured here, on packets arriving; the outbound figures are what the
    // far end reports about our transmissions, and are the ones the
    // scheduler ranks on. A path can be fine one way and unusable the other,
    // and until these were shown separately that was invisible.
    const inLabel = p.tx_reported ? `<span class="dir">in</span>` : "";
    const outRows = p.tx_reported ? `
        <div class="metric"><div class="k" title="One-way network delay in the send direction: half this path's RTT floor plus the peer's reported p95 tail. Measured by the peer, not by this end - send and receive are independent paths and routinely disagree.">Network <span class="dir">out</span></div>
          <div class="v" title="one-way network delay in the send direction: half the ${fmt(p.rtt_floor_ms)} ms round-trip floor, plus the ${fmt(p.tx_spread_ms)} ms p95 tail the peer measured. The two directions' figures sum to about the round-trip floor, which is the symmetry assumption checking out.">${fmt(p.tx_delay_ms - (cfg.base_delay_ms || 0))} ms</div></div>
        <div class="metric"><div class="k" title="What the E-model scorer is actually fed for outbound delay: the network figure to the left, plus a fixed non-network allowance (codec framing, jitter buffer, the hairpin through home) set by Base delay. Not comparable to a raw round trip.">Score delay <span class="dir">out</span></div>
          <div class="v" title="what the E-model is actually fed: the ${fmt(p.tx_delay_ms - (cfg.base_delay_ms || 0))} ms above plus a fixed ${cfg.base_delay_ms || 0} ms of non-network budget - codec framing, the far end's jitter buffer, and the hairpin through home. Both ends add that constant independently, so this figure is NOT comparable with the round trip.">${fmt(p.tx_delay_ms)} ms</div></div>
        <div class="metric"><div class="k" title="The peer's measured 95th-percentile tail latency on packets this end sent it - the send direction, which cannot be observed locally.">p95 spread <span class="dir">out</span></div><div class="v">${fmt(p.tx_spread_ms)} ms</div></div>
        <div class="metric"><div class="k" title="The peer's measured RFC 3550 interarrival jitter on this end's transmissions.">Jitter <span class="dir">out</span></div><div class="v">${fmt(p.tx_jitter_ms)} ms</div></div>
        <div class="metric"><div class="k" title="The peer's measured queue buildup on this end's send direction - the only direct evidence of congestion on the path this end transmits on.">Queue delay <span class="dir">out</span></div><div class="v">${fmt(p.tx_queue_delay_ms)} ms</div></div>
        <div class="metric"><div class="k" title="Loss rate the peer reports on this end's transmissions, over roughly the last minute. This is the figure a send decision actually needs - a round trip alone can't say which direction loss happened in.">Loss <span class="dir">out</span></div>
          <div class="v" style="color:var(--${lossClass(p.tx_loss_percent)})">${fmt(p.tx_loss_percent, 2)}%</div></div>
        <div class="metric"><div class="k" title="The least transit above this path's floor over the last ~100 ms, as the peer measured it on this end's transmissions. A lone jitter spike does not move it; a queue that is really building does. This is what the bulk cascade paces on.">Standing queue <span class="dir">out</span></div><div class="v">${fmt(p.tx_standing_queue_ms)} ms</div></div>
        <div class="metric"><div class="k" title="Loss over the last second on this end's transmissions, as the peer measured it. The fast figure the bulk cascade reacts to; the one-minute figure beside it is for judging the path.">Loss 1 s <span class="dir">out</span></div>
          <div class="v" style="color:var(--${lossClass(p.tx_short_loss_percent)})">${fmt(p.tx_short_loss_percent, 1)}%</div></div>` : "";

    const bulkRow = p.cascade_position >= 0 ? `
        <div class="metric"><div class="k" title="This path's place in the bulk cascade: bulk fills place 1 first and spills to the next place only once a path congests. The call's path is always last, and otherwise treated like any path - a call never holds bulk back. The cap is how much bulk the path takes before the rest spills on - uncapped until its queue or loss says it is full.">Bulk ${p.cascade_position + 1}${p.cascade_protected ? " · call's path" : ""}</div>
          <div class="v" title="${p.bulk_cap_kbps > 0 ? "capped at " + rate(p.bulk_cap_kbps) : "uncapped"}">${rate(p.bulk_kbps)}${p.bulk_cap_kbps > 0 ? " / " + rate(p.bulk_cap_kbps) : ""}</div></div>` : "";

    const bindRow = owns
      ? `<div class="metric"><div class="k" title="Times this path's socket has gone down and come back since the daemon started - an interface bounce, DHCP renewal, or address change on this physical link specifically.">Link drops</div>
           <div class="v" title="times this link has gone away since the daemon started, address changes included">${p.drops || 0}</div></div>`
      : "";

    return `<div class="path ${(owns && !p.bound) ? "dead" : p.alive ? "alive" : "dead"}">
      <div class="path-head">
        <span class="path-name">${p.label || p.name || "path " + p.id}</span>${p.label && p.name ? `<span class="tag">${p.name}</span>` : ""}
        <span class="muted">#${p.id}</span>
        ${tags}
      </div>
      <div class="metric-group">
        <h3>Live</h3>
        <div class="metrics">
          <div class="metric"><div class="k" title="Mean Opinion Score (1-5), the R-factor at right converted to the scale a person reads at a glance. This is what a call would sound like if steered onto this path alone, right now.">Quality</div>
            <div class="v" style="color:var(--${mosClass(p.mos)})" title="${penalty}">${fmt(p.mos, 2)} MOS</div></div>
          <div class="metric"><div class="k" title="ITU-T G.107 R-factor (0-100): one-way delay and loss combined into the single number the scheduler actually ranks paths on, after penalties for burst loss, flapping, and budget.">Score</div>
            <div class="v" title="E-model R factor after penalties; the scheduler ranks on this">${fmt(p.score, 0)} R</div></div>
          <div class="metric"><div class="k" title="Most recent round-trip time, measured by echoing a timestamp back. The two ends' clocks never need to be synchronized for this to be valid.">RTT</div>
            <div class="v" title="round trip; floor ${fmt(p.rtt_floor_ms)} ms with nothing queued on it">${fmt(p.rtt_ms)} ms</div></div>
          <div class="metric"><div class="k" title="95th-percentile transit time above this path's own floor, over roughly the last 200 packets received here. Tail latency - what a call actually feels, not the average.">p95 spread ${inLabel}</div><div class="v">${fmt(p.p95_spread_ms)} ms</div></div>
          <div class="metric"><div class="k" title="RFC 3550 interarrival jitter: smoothed packet-to-packet variation in arrival timing, measured on packets received here.">Jitter ${inLabel}</div><div class="v">${fmt(p.jitter_ms)} ms</div></div>
          <div class="metric"><div class="k" title="How far the most recent packet's transit exceeds this path's own rolling-minimum delay - i.e. how full the buffer ahead of it is right now, inbound.">Queue delay ${inLabel}</div><div class="v">${fmt(p.queue_delay_ms)} ms</div></div>
          <div class="metric"><div class="k" title="Loss rate over roughly the last minute, measured directly on packets arriving here.">Loss ${inLabel}</div>
            <div class="v" style="color:var(--${lossClass(p.recent_loss_percent)})">${fmt(p.recent_loss_percent, 2)}%</div></div>
          ${outRows}
          ${bulkRow}
          <div class="metric"><div class="k" title="Current outbound bit rate on this path: data, any duplicated copies, and protocol overhead (echoes, reports, MTU probes) combined.">Sending</div>
            <div class="v" title="what is going onto this path right now">${rate(p.send_kbps)}</div></div>
          <div class="metric"><div class="k" title="Estimated usable ceiling: the send rate at which this path's own queue was last seen to build, discounted the longer that measurement goes unconfirmed. The only bandwidth figure the scheduler itself acts on.">Capacity</div>
            <div class="v" title="${capacityNote}">${capacity}</div></div>
          <div class="metric"><div class="k" title="Largest physical packet size confirmed to cross this path by active probing. The tunnel's own MTU is the smallest of these across every path, so one small path caps everyone.">Path MTU</div><div class="v">${p.path_mtu || "—"}</div></div>
          <div class="metric"><div class="k" title="How many of the last 200 packets back the delay and jitter figures above. Below 20, treat this path's statistics as too thin to trust - especially before promoting it.">Samples</div><div class="v">${p.samples}</div></div>
          <div class="metric"><div class="k" title="Time since anything last arrived on this path. A live call needs this in the low single digits of seconds; a value that keeps climbing is a path going quiet.">Last seen</div>
            <div class="v">${p.last_seen_seconds < 0 ? "never" : duration(p.last_seen_seconds)}</div></div>
        </div>
      </div>

      <div class="metric-group">
        <h3>Cumulative</h3>
        <div class="metrics">
          <div class="metric"><div class="k" title="Total loss since the daemon started, as a percentage of everything meant to arrive. Unlike the recent figure above, an old incident never ages out of this one - read it as history, not current health.">Loss (lifetime)</div>
            <div class="v" title="${p.lost.toLocaleString()} packets since the daemon started">${fmt(p.loss_percent, 2)}%</div></div>
          <div class="metric"><div class="k" title="Total packets delivered on this path since the daemon started.">Received</div><div class="v">${p.received.toLocaleString()}</div></div>
          ${budgetRow(p)}
          ${bindRow}
        </div>
      </div>
      ${diagBlock(owns, p)}
    </div>`;
  }).join("");
}

// diagBlock is the on-demand link tests for one path: the iperf test and UDP
// flood of the tunnel uplink to home, the speedtest of the carrier's own
// internet capacity, and the scheduler-pinned UDP flood (D-048). All are
// shown only on the end that owns the path and only while the link is up -
// the first three pin to the interface with the same SO_BINDTODEVICE the
// daemon uses and there is nothing to bind to on a link that is down, and
// the pinned test cannot force traffic onto a socket that is not up either.
// Each test's state lives in diagRuns[id] - .iperf, .speed, .udp, .pinned -
// rather than in the DOM, so the once-a-second refresh that rebuilds every
// card does not wipe a test in progress or its result, and running one test
// does not clear another's result.
function diagBlock(owns, p) {
  if (!owns || !p.bound) return "";
  const d = diagRuns[p.id] || {};
  return `<div class="diag">
    <div class="diag-row">
      <button class="diag-btn" ${d.iperf && d.iperf.running ? "disabled" : ""} onclick="runBandwidthTest(${p.id})">
        ${d.iperf && d.iperf.running ? "Testing…" : "Test uplink (iperf)"}</button>
      <span class="muted" title="A real saturating upload over the tunnel to home, in parallel streams so it reads the tunnel's actual capacity rather than a single stream's window-limited floor. Spends uplink data - a diagnostic, not something to leave running on a metered link.">tunnel uplink to home, parallel · spends uplink data</span>
      <div class="diag-result">${iperfResultHTML(d.iperf)}</div>
    </div>
    <div class="diag-row">
      <button class="diag-btn" ${d.speed && d.speed.running ? "disabled" : ""} onclick="runSpeedtest(${p.id})">
        ${d.speed && d.speed.running ? "Testing…" : "Speedtest (internet)"}</button>
      <span class="muted" title="A public-internet speed test over this link's own carrier, bypassing the tunnel - a different measurement from the iperf test. It runs download AND upload and spends tens of MB of real, possibly metered, data each run.">carrier internet, down + up · spends tens of MB</span>
      <div class="diag-result">${speedResultHTML(d.speed)}</div>
    </div>
    <div class="diag-row">
      <button class="diag-btn" ${d.udp && d.udp.running ? "disabled" : ""} onclick="runUdpFlood(${p.id})">
        ${d.udp && d.udp.running ? "Flooding…" : "Flood uplink (UDP)"}</button>
      <span class="muted" title="A UDP flood over the tunnel to home: iperf sends as fast as it can and reports what got through plus the loss above that. Unlike TCP it does not back off, so it finds the raw forwarding ceiling - and it saturates the link for the duration, disrupting anything else on it, and spends data at the full offered rate. A deliberate stress test.">tunnel, unlimited UDP · saturates the link · spends data fast</span>
      <div class="diag-result">${udpResultHTML(d.udp)}</div>
    </div>
    <div class="diag-row">
      <button class="diag-btn" ${d.pinned && d.pinned.running ? "disabled" : ""} onclick="runPinnedFlood(${p.id})">
        ${d.pinned && d.pinned.running ? "Flooding…" : "Flood via scheduler (forced)"}</button>
      <span class="muted" title="The same UDP flood, but sent through ompd's own classification and scheduling instead of bound straight to the interface, with the daemon told to force this one flow onto this path regardless of what its load-balancing gates would normally allow. The 'Flood uplink' button above measures what the carrier will give any traffic; this measures what ompd's own scheduler actually does with it - including a path currently excluded from load balancing, which is usually the one worth asking about.">through ompd, forced path · saturates the link · spends data fast</span>
      <div class="diag-result">${pinnedResultHTML(d.pinned)}</div>
    </div>
  </div>`;
}

function iperfResultHTML(d) {
  if (!d) return "";
  if (d.running) return `<span class="muted">saturating the tunnel…</span>`;
  if (d.error) return `<span style="color:var(--bad)">iperf: ${d.error}</span>`;
  if (d.mbps == null) return "";
  const est = d.est || {};
  const estStr = est.ceiling_known ? rate(est.limit_kbps) : "unmeasured";
  return `<strong>${d.mbps.toFixed(1)} Mbps</strong> up to home (aggregate)`
    + (d.retransmits ? ` · ${d.retransmits} retransmits` : "")
    + ` · estimator says ${estStr}`;
}

function speedResultHTML(d) {
  if (!d) return "";
  if (d.running) return `<span class="muted">running internet speed test…</span>`;
  if (d.error) return `<span style="color:var(--bad)">speedtest: ${d.error}</span>`;
  if (d.down == null) return "";
  const mb = d.bytes ? ` · spent ${(d.bytes / 1e6).toFixed(0)} MB` : "";
  return `<strong>↓ ${d.down.toFixed(1)}</strong> / <strong>↑ ${d.up.toFixed(1)} Mbps</strong>`
    + ` · ${d.ping.toFixed(0)} ms`
    + (d.server ? ` · ${d.server}` : "") + mb;
}

function udpResultHTML(d) {
  if (!d) return "";
  if (d.running) return `<span class="muted">flooding the tunnel…</span>`;
  if (d.error) return `<span style="color:var(--bad)">flood: ${d.error}</span>`;
  if (d.delivered == null) return "";
  const lossColor = d.loss >= 5 ? "var(--bad)" : d.loss >= 1 ? "var(--warn)" : "var(--good)";
  // No byte figure: iperf's "offered" bytes count everything written to the
  // socket, most of which a -b 0 flood drops at the local send queue before
  // it ever reaches the carrier, so reporting it as data spent overstates the
  // real cost many times over. The rates and loss are the honest result.
  return `<strong>${d.delivered.toFixed(1)} Mbps</strong> delivered`
    + ` of ${d.offered.toFixed(0)} offered`
    + ` · <span style="color:${lossColor}">${d.loss.toFixed(1)}% loss</span>`
    + ` · ${d.jitter.toFixed(1)} ms jitter`;
}

function pinnedResultHTML(d) {
  if (!d) return "";
  if (d.running) return `<span class="muted">forcing the flow onto this path…</span>`;
  if (d.error) return `<span style="color:var(--bad)">pinned flood: ${d.error}</span>`;
  if (d.delivered == null) return "";
  const lossColor = d.loss >= 5 ? "var(--bad)" : d.loss >= 1 ? "var(--warn)" : "var(--good)";
  return `<strong>${d.delivered.toFixed(1)} Mbps</strong> delivered`
    + ` of ${d.offered.toFixed(0)} offered`
    + ` · <span style="color:${lossColor}">${d.loss.toFixed(1)}% loss</span>`
    + ` · ${d.jitter.toFixed(1)} ms jitter`
    + ` <span class="muted">(through ompd, forced)</span>`;
}

// runBandwidthTest and runSpeedtest each trigger their test and record the
// outcome under diagRuns[id], leaving the other test's result untouched.
async function runBandwidthTest(id) {
  const d = diagRuns[id] || (diagRuns[id] = {});
  d.iperf = { running: true };
  if (lastState) renderPaths(lastState);
  try {
    const r = await fetch("/api/diag/bandwidth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path_id: id, seconds: 10 }),
    });
    const b = await r.json().catch(() => ({}));
    if (!r.ok) d.iperf = { error: b.error || ("HTTP " + r.status) };
    else if (b.error) d.iperf = { error: b.error, est: b.estimate };
    else d.iperf = { mbps: b.result.mbps, retransmits: b.result.retransmits, est: b.estimate };
  } catch (e) {
    d.iperf = { error: String(e) };
  }
  if (lastState) renderPaths(lastState);
}

async function runSpeedtest(id) {
  const d = diagRuns[id] || (diagRuns[id] = {});

async function refreshState() {
  let r;
  try {
    r = await (await fetch("/api/state")).json();
  } catch (e) {
    $("freshness").className = "stale";
    $("freshness").textContent = "Cannot reach this interface.";
    return;
  }

  if (!r.available) {
    $("freshness").className = "stale";
    $("freshness").textContent = "The daemon has not written any state. It may not be running. " + (r.error || "");
    return;
  }

  const s = r.state, age = r.age_seconds;
  lastState = s;
  // Two report intervals of slack before calling it stale, so a single
  // missed write does not raise an alarm.
  const limit = Math.max(5, (s.config.state_interval_ms / 1000) * 3);
  if (age > limit) {
    $("freshness").className = "stale";
    $("freshness").textContent =
      `Data is ${duration(age)} old — the daemon has stopped updating it. Everything below is history.`;
  } else {
    $("freshness").className = "fresh";
    $("freshness").textContent = `Live — updated ${age < 1.5 ? "just now" : duration(age) + " ago"}.`;
  }

  $("node").textContent = s.node || "OpenMultiPath";
  $("role").textContent = s.role;
  $("uptime").textContent = "up " + duration(s.uptime_seconds);
  renderAggregate(s);
  renderScheduler(s);
  renderPaths(s);
}

// The one setting that is not a number. Duplication is the difference
// between resilience and saturating a 512k link, so it is worth being able
// to change without editing a file.
const DUPLICATE_HINTS = {
  "off": "One copy, always. A handover becomes cut-then-connect, which is audible.",
  "switching": "One copy, except during a handover. The default.",
  "unstable": "Also duplicate while the chosen path is degraded. Costly until classification can limit this to real-time traffic.",
  "always": "Every packet on every usable path. This is what saturated the standby-plan link.",
};

// How bulk is placed, and the v0.2 kill switch.
const BULK_HINTS = {
  "cascade": "Bulk per packet: slowest path first, spilling onto faster ones as each fills, the call's path last. The default. Needs both ends on v0.2.",
  "flow": "v0.1: one flow to one path, and a gate that stops bulk when the call's path queues. The way back if the cascade misbehaves.",
};

async function loadConfig() {
  const r = await (await fetch("/api/config")).json();
  const modes = Object.keys(DUPLICATE_HINTS);
  const current = r.config.duplicate_mode || "switching";

  $("fields").innerHTML = FIELDS.map(([key, label, unit, hint]) => {
    const b = r.bounds[key] || {};
    return `<div class="field">
      <label for="${key}">${label}</label>
      <span><input type="number" id="${key}" name="${key}" value="${r.config[key]}"
        min="${b.Min}" max="${b.Max}" step="1"> <span class="muted">${unit}</span></span>
      <div class="hint">${hint} Range ${b.Min}–${b.Max}.</div>
    </div>`;
  }).join("") +
  `<div class="field">
     <label for="duplicate_mode">Duplication</label>
     <span><select id="duplicate_mode" name="duplicate_mode">
       ${modes.map(m => `<option value="${m}"${m === current ? " selected" : ""}>${m}</option>`).join("")}
     </select></span>
     <div class="hint" id="duplicate_hint">${DUPLICATE_HINTS[current]}</div>
   </div>
   <div class="field">
     <label for="bulk_scheduler">Bulk placement</label>
     <span><select id="bulk_scheduler" name="bulk_scheduler">
       ${Object.keys(BULK_HINTS).map(m => `<option value="${m}"${m === (r.config.bulk_scheduler || "cascade") ? " selected" : ""}>${m}</option>`).join("")}
     </select></span>
     <div class="hint" id="bulk_hint">${BULK_HINTS[r.config.bulk_scheduler || "cascade"]}</div>
   </div>`;
  $("bulk_scheduler").addEventListener("change", e => {
    $("bulk_hint").textContent = BULK_HINTS[e.target.value] || "";
  });

  $("duplicate_mode").addEventListener("change", e => {
    $("duplicate_hint").textContent = DUPLICATE_HINTS[e.target.value] || "";
  });
}

$("config").addEventListener("submit", async e => {
  e.preventDefault();
  const body = {};
  for (const [key] of FIELDS) body[key] = Number($(key).value);
  body.duplicate_mode = $("duplicate_mode").value;
  body.bulk_scheduler = $("bulk_scheduler").value;

  const res = await fetch("/api/config", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    alert("Could not save: " + await res.text());
    return;
  }
  // Re-read rather than trusting what was typed: values out of range come
  // back corrected, and the form should show what actually took effect.
  const r = await res.json();
  for (const [key] of FIELDS) $(key).value = r.config[key];
  $("duplicate_mode").value = r.config.duplicate_mode;
  $("bulk_scheduler").value = r.config.bulk_scheduler;
  $("saved").hidden = false;
  setTimeout(() => { $("saved").hidden = true; }, 2500);
});

async function loadLogs() {
  const r = await (await fetch("/api/logs")).json();
  const el = $("logs");
  el.textContent = (r.lines || []).join("\n");
  el.scrollTop = el.scrollHeight;
}

$("refresh-logs").addEventListener("click", loadLogs);

$("restart").addEventListener("click", async () => {
  if (!confirm("Restart the daemon? The tunnel drops for a moment.")) return;
  $("restart-note").textContent = "Restarting…";
  const res = await fetch("/api/restart", {method: "POST"});
  $("restart-note").textContent = res.ok ? "Restarted." : "Failed: " + await res.text();
  setTimeout(loadLogs, 1500);
});

refreshState();
loadConfig();
loadLogs();
setInterval(refreshState, 1000);
</script>
</body>
</html>
