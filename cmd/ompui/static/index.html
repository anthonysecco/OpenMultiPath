<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMultiPath</title>
<style>
  /* Dark, high contrast, large figures. This gets read on a phone, at
     night, by someone who is already annoyed about something. */
  :root {
    --bg: #12151a; --panel: #1a1f27; --line: #2a323d;
    --text: #e6edf3; --dim: #8b98a8;
    --good: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .role { color: var(--dim); font-size: 13px; }
  main { padding: 18px; max-width: 1100px; margin: 0 auto; }
  section { margin-bottom: 26px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }

  /* The staleness banner is the most important thing on the page: every
     other number is only as true as this one is recent. */
  #freshness {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 20px;
    font-weight: 600; border: 1px solid transparent;
  }
  .fresh { background: #10281a; color: var(--good); border-color: #1c4429 !important; }
  .stale { background: #2d1618; color: var(--bad); border-color: #5c2326 !important; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
  .card .value { font-size: 26px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }

  .path {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .path.alive { border-left-color: var(--good); }
  .path.dead  { border-left-color: var(--bad); }
  .path-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .path-name { font-weight: 650; font-size: 16px; }
  .metrics { display: grid; gap: 10px 16px; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); }
  .metric .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .dir { display: inline-block; padding: 0 4px; border-radius: 3px; background: rgba(127,127,127,.18);
         font-size: 9px; letter-spacing: .04em; vertical-align: 1px; }
  .metric .v { font-size: 17px; font-variant-numeric: tabular-nums; margin-top: 1px; }

  .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .tag.good { color: var(--good); border-color: #1c4429; }
  .tag.bad  { color: var(--bad);  border-color: #5c2326; }
  .tag.warn { color: var(--warn); border-color: #4a3a12; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 10px 5px 0; }
  th { color: var(--dim); font-weight: 500; }
  td { font-variant-numeric: tabular-nums; }

  form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .field { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 12px; }
  .field label { font-size: 14px; }
  .field .hint { color: var(--dim); font-size: 12px; grid-column: 1 / -1; margin-top: -6px; }
  input[type=number], select {
    background: #0d1117; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; width: 130px; font: inherit;
    font-variant-numeric: tabular-nums;
  }
  button {
    background: var(--accent); color: #04121f; border: 0; border-radius: 6px;
    padding: 8px 15px; font: inherit; font-weight: 650; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:hover { filter: brightness(1.1); }
  .saved { color: var(--good); font-size: 13px; margin-left: 10px; }

  pre#logs {
    background: #0d1117; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; max-height: 340px; overflow: auto;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #b9c5d3; white-space: pre-wrap; word-break: break-word;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="node">OpenMultiPath</h1>
  <span class="role" id="role"></span>
  <span class="role" id="uptime"></span>
</header>

<main>
  <div id="freshness" class="stale">Waiting for the daemon&hairsp;&hellip;</div>

  <section>
    <h2>Aggregate</h2>
    <div class="cards" id="aggregate"></div>
  </section>

  <section>
    <h2>Scheduling</h2>
    <div id="scheduler"></div>
  </section>

  <section>
    <h2>Paths</h2>
    <div id="paths"></div>
  </section>

  <section>
    <h2>Settings</h2>
    <form id="config">
      <div id="fields"></div>
      <div class="row">
        <button type="submit">Save</button>
        <span class="muted">Applied to the running daemon within a few seconds. Out-of-range values are corrected.</span>
        <span class="saved" id="saved" hidden>Saved</span>
      </div>
    </form>
  </section>

  <section>
    <h2>Daemon log</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="secondary" id="refresh-logs" type="button">Refresh</button>
      <button class="secondary" id="restart" type="button">Restart daemon</button>
      <span class="muted" id="restart-note"></span>
    </div>
    <pre id="logs">Loading&hellip;</pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = (n, d = 1) => (n === undefined || n === null) ? "—" : Number(n).toFixed(d);

function duration(sec) {
  if (sec < 60) return Math.round(sec) + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m " + Math.round(sec % 60) + "s";
  const h = Math.floor(sec / 3600);
  return h + "h " + Math.floor((sec % 3600) / 60) + "m";
}

// Bitrates span four orders of magnitude here - a 512k standby tier and a
// 200 Mbps dish are both normal - so they are scaled rather than printed as
// a wall of digits nobody can compare at a glance.
function rate(kbps) {
  if (kbps === undefined || kbps === null) return "—";
  if (kbps >= 1000) return fmt(kbps / 1000, kbps >= 10000 ? 0 : 1) + " Mbps";
  return fmt(kbps, 0) + " kbps";
}

// A path's own loss rate is what decides whether its numbers are worth
// believing, so colour it rather than leaving it as one figure among many.
function lossClass(pct) {
  if (pct >= 2) return "bad";
  if (pct >= 0.5) return "warn";
  return "good";
}

function card(label, value, sub) {
  return `<div class="card"><div class="label">${label}</div>` +
         `<div class="value">${value}</div>` +
         (sub ? `<div class="sub">${sub}</div>` : "") + `</div>`;
}

function renderAggregate(s) {
  const a = s.aggregate;
  const mtuSub = s.recommended_tunnel_mtu
    ? (s.recommended_tunnel_mtu === s.tunnel_mtu
        ? "matches the measured paths"
        : `paths measured at ${s.recommended_tunnel_mtu}`)
    : "paths not yet measured";

  $("aggregate").innerHTML =
    card("Paths alive", `${a.paths_alive}/${a.paths_total}`) +
    card("Loss (recent)", fmt(a.recent_loss_percent, 2) + "%", "last minute") +
    card("Loss (lifetime)", fmt(a.loss_percent, 2) + "%",
         `${a.lost.toLocaleString()} of ${(a.received + a.lost).toLocaleString()}`) +
    card("Best RTT", a.best_rtt_ms ? fmt(a.best_rtt_ms) + " ms" : "—",
         "lowest across live paths") +
    card("Received", a.received.toLocaleString()) +
    card("Tunnel MTU", s.tunnel_mtu || "—", mtuSub);
}

// A path's state is the first thing to read when the choice looks wrong,
// so it gets a colour rather than being one word among many.
function stateClass(state) {
  if (state === "stable") return "good";
  if (state === "unstable") return "warn";
  return "bad";
}

// MOS is the score restated on the 1-to-5 scale people already have
// intuitions about. Anything under 3.6 is the point at which the scheduler
// itself considers a path inadequate.
function mosClass(mos) {
  if (mos >= 4) return "good";
  if (mos >= 3.6) return "warn";
  return "bad";
}

function renderScheduler(s) {
  const sc = s.scheduler || {};
  const named = id => {
    const p = (s.paths || []).find(p => p.id === id);
    return p ? (p.name || "path " + id) : "path " + id;
  };

  // Blind means the measurements have stopped being able to help and
  // traffic is going everywhere in the hope something gets through. It is
  // the fail-to-a-working-state behaviour and it should be impossible to
  // miss.
  if (sc.blind) {
    $("scheduler").innerHTML =
      `<div class="path dead"><div class="path-head">
         <span class="path-name">No usable path</span>
         <span class="tag bad">sending on everything</span>
       </div>
       <p class="muted">${sc.reason || ""} Every path is down, so traffic is being duplicated across
       every link that is still bound rather than dropped.</p></div>`;
    return;
  }

  if (sc.primary === undefined || sc.primary < 0) {
    $("scheduler").innerHTML = `<p class="muted">No path chosen yet.</p>`;
    return;
  }

  const handover = sc.switching
    ? `<span class="tag warn">handing over to ${named(sc.switching_to)}</span>`
    : "";

  const order = (sc.ranking || []).map((id, i) =>
    `${i + 1}. ${named(id)}`).join("&nbsp; ");

  $("scheduler").innerHTML =
    `<div class="path alive"><div class="path-head">
       <span class="path-name">Carrying traffic on ${named(sc.primary)}</span>
       ${handover}
       <span class="tag">${sc.duplicate_mode || ""}</span>
     </div>
     <p class="muted">${sc.reason || ""}</p>
     ${order ? `<p class="muted">Ranked: ${order}</p>` : ""}
     </div>`;
}

function renderPaths(s) {
  // base_delay_ms is a fixed non-network budget folded into the scoring
  // delay. It has to be visible, and separable: shown alone the scoring
  // figure looks like a one-way latency that exceeds the round trip, which
  // is how it got queried.
  const cfg = s.config || {};
  if (!s.paths || !s.paths.length) {
    $("paths").innerHTML = `<p class="muted">No paths yet.</p>`;
    return;
  }
  // Only the initiator owns its sockets, so only it can say whether a
  // link is bound. On the responder these fields are absent and the
  // interface must not read that absence as every path being down.
  const owns = s.manages_paths;

  $("paths").innerHTML = s.paths.map(p => {
    // A link that is not bound and a link that is bound but silent are
    // different faults with different fixes - the modem has not come back
    // versus something past it is broken - so they get different words.
    const status = (owns && !p.bound)
      ? `<span class="tag bad">link down</span>`
      : p.alive ? `<span class="tag good">alive</span>`
                : `<span class="tag bad">no traffic</span>`;

    const tags = [
      status,
      p.state ? `<span class="tag ${stateClass(p.state)}">${p.state}${p.state_reason ? " · " + p.state_reason : ""}</span>` : "",
      p.primary ? `<span class="tag good">primary</span>`
                : p.sending ? `<span class="tag">sending</span>` : "",
      p.flapping ? `<span class="tag bad">flapping</span>` : "",
      p.thin ? `<span class="tag warn">thin statistics</span>` : "",
      p.tx_reported ? "" : `<span class="tag warn" title="the far end is not reporting on this path, so it is being scored on half a round trip and on inbound measurements - the wrong direction for a send decision">no outbound report</span>`,
      (p.path_mtu && !p.usable) ? `<span class="tag bad">below tunnel floor</span>` : "",
      (owns && p.local) ? `<span class="tag">via ${p.local}</span>` : "",
      p.remote ? `<span class="tag">${p.remote}</span>` : "",
    ].join(" ");

    // Score differing from the raw quality figure is the visible evidence
    // of a penalty: a healthy R with a poor score means the path is being
    // held back for its history, not for its current measurements.
    const penalty = (p.r_factor - p.score) >= 1
      ? `penalised ${fmt(p.r_factor - p.score, 0)} R` : "raw quality";

    const bursts = (p.bursts || []).filter(b => b.count > 0);
    const burstRow = bursts.length
      ? `<table style="margin-top:12px"><tr><th>Loss bursts</th>` +
        bursts.map(b => `<th>${b.label}</th>`).join("") + `</tr><tr><td></td>` +
        bursts.map(b => `<td>${b.count}</td>`).join("") + `</tr></table>`
      : "";

    // Capacity. The estimate is honest about how it was arrived at, because
    // the three cases call for different responses: a measured ceiling can
    // be acted on, a floor from clean carriage only says "at least this",
    // and never having loaded the path says nothing at all. Showing one
    // number for all three would invite trusting the weakest of them.
    const capacity = p.ceiling_known
      ? `${rate(p.ceiling_kbps)}`
      : p.ceiling_age_seconds >= 0 ? `≥ ${rate(p.proven_kbps)}` : "unknown";

    // What ages is the confidence, never the value: an idle hour is not
    // evidence that a link shrank. The discount the scheduler is currently
    // applying is shown rather than folded silently into the headline.
    const capacityNote = p.ceiling_known
      ? (p.limit_kbps < p.ceiling_kbps * 0.99
          ? `measured ${duration(p.ceiling_age_seconds)} ago; the scheduler is currently assuming ${rate(p.limit_kbps)} while it goes unconfirmed`
          : `measured ${duration(p.ceiling_age_seconds)} ago, where queueing set in`)
      : p.ceiling_age_seconds >= 0
        ? "the most this path has carried without the link filling; its actual ceiling is unmeasured"
        : "nothing has ever loaded this path, so nothing is assumed about what it can carry";

    // Inbound and outbound are labelled apart because they are measured in
    // different places and routinely disagree. Everything unlabelled is
    // measured here, on packets arriving; the outbound figures are what the
    // far end reports about our transmissions, and are the ones the
    // scheduler ranks on. A path can be fine one way and unusable the other,
    // and until these were shown separately that was invisible.
    const inLabel = p.tx_reported ? `<span class="dir">in</span>` : "";
    const outRows = p.tx_reported ? `
        <div class="metric"><div class="k">Network <span class="dir">out</span></div>
          <div class="v" title="one-way network delay in the send direction: half the ${fmt(p.rtt_floor_ms)} ms round-trip floor, plus the ${fmt(p.tx_spread_ms)} ms p95 tail the peer measured. The two directions' figures sum to about the round-trip floor, which is the symmetry assumption checking out.">${fmt(p.tx_delay_ms - (cfg.base_delay_ms || 0))} ms</div></div>
        <div class="metric"><div class="k">Score delay <span class="dir">out</span></div>
          <div class="v" title="what the E-model is actually fed: the ${fmt(p.tx_delay_ms - (cfg.base_delay_ms || 0))} ms above plus a fixed ${cfg.base_delay_ms || 0} ms of non-network budget - codec framing, the far end's jitter buffer, and the hairpin through home. Both ends add that constant independently, so this figure is NOT comparable with the round trip.">${fmt(p.tx_delay_ms)} ms</div></div>
        <div class="metric"><div class="k">p95 spread <span class="dir">out</span></div><div class="v">${fmt(p.tx_spread_ms)} ms</div></div>
        <div class="metric"><div class="k">Jitter <span class="dir">out</span></div><div class="v">${fmt(p.tx_jitter_ms)} ms</div></div>
        <div class="metric"><div class="k">Queue delay <span class="dir">out</span></div><div class="v">${fmt(p.tx_queue_delay_ms)} ms</div></div>
        <div class="metric"><div class="k">Loss <span class="dir">out</span></div>
          <div class="v" style="color:var(--${lossClass(p.tx_loss_percent)})">${fmt(p.tx_loss_percent, 2)}%</div></div>` : "";

    const bindRow = owns
      ? `<div class="metric"><div class="k">Link drops</div>
           <div class="v" title="times this link has gone away since the daemon started, address changes included">${p.drops || 0}</div></div>`
      : "";

    return `<div class="path ${(owns && !p.bound) ? "dead" : p.alive ? "alive" : "dead"}">
      <div class="path-head">
        <span class="path-name">${p.name || "path " + p.id}</span>
        <span class="muted">#${p.id}</span>
        ${tags}
      </div>
      <div class="metrics">
        <div class="metric"><div class="k">Quality</div>
          <div class="v" style="color:var(--${mosClass(p.mos)})" title="${penalty}">${fmt(p.mos, 2)} MOS</div></div>
        <div class="metric"><div class="k">Score</div>
          <div class="v" title="E-model R factor after penalties; the scheduler ranks on this">${fmt(p.score, 0)} R</div></div>
        <div class="metric"><div class="k">RTT</div>
          <div class="v" title="round trip; floor ${fmt(p.rtt_floor_ms)} ms with nothing queued on it">${fmt(p.rtt_ms)} ms</div></div>
        <div class="metric"><div class="k">p95 spread ${inLabel}</div><div class="v">${fmt(p.p95_spread_ms)} ms</div></div>
        <div class="metric"><div class="k">Jitter ${inLabel}</div><div class="v">${fmt(p.jitter_ms)} ms</div></div>
        <div class="metric"><div class="k">Queue delay ${inLabel}</div><div class="v">${fmt(p.queue_delay_ms)} ms</div></div>
        <div class="metric"><div class="k">Loss ${inLabel}</div>
          <div class="v" style="color:var(--${lossClass(p.recent_loss_percent)})">${fmt(p.recent_loss_percent, 2)}%</div></div>
        ${outRows}
        <div class="metric"><div class="k">Loss (lifetime)</div>
          <div class="v" title="${p.lost.toLocaleString()} packets since the daemon started">${fmt(p.loss_percent, 2)}%</div></div>
        <div class="metric"><div class="k">Received</div><div class="v">${p.received.toLocaleString()}</div></div>
        <div class="metric"><div class="k">Sending</div>
          <div class="v" title="what is going onto this path right now; peak ${rate(p.peak_kbps)}">${rate(p.send_kbps)}</div></div>
        <div class="metric"><div class="k">Capacity</div>
          <div class="v" title="${capacityNote}">${capacity}</div></div>
        <div class="metric"><div class="k">Path MTU</div><div class="v">${p.path_mtu || "—"}</div></div>
        <div class="metric"><div class="k">Samples</div><div class="v">${p.samples}</div></div>
        <div class="metric"><div class="k">Last seen</div>
          <div class="v">${p.last_seen_seconds < 0 ? "never" : duration(p.last_seen_seconds)}</div></div>
        ${bindRow}
      </div>
      ${burstRow}
    </div>`;
  }).join("");
}

async function refreshState() {
  let r;
  try {
    r = await (await fetch("/api/state")).json();
  } catch (e) {
    $("freshness").className = "stale";
    $("freshness").textContent = "Cannot reach this interface.";
    return;
  }

  if (!r.available) {
    $("freshness").className = "stale";
    $("freshness").textContent = "The daemon has not written any state. It may not be running. " + (r.error || "");
    return;
  }

  const s = r.state, age = r.age_seconds;
  // Two report intervals of slack before calling it stale, so a single
  // missed write does not raise an alarm.
  const limit = Math.max(5, (s.config.state_interval_ms / 1000) * 3);
  if (age > limit) {
    $("freshness").className = "stale";
    $("freshness").textContent =
      `Data is ${duration(age)} old — the daemon has stopped updating it. Everything below is history.`;
  } else {
    $("freshness").className = "fresh";
    $("freshness").textContent = `Live — updated ${age < 1.5 ? "just now" : duration(age) + " ago"}.`;
  }

  $("node").textContent = s.node || "OpenMultiPath";
  $("role").textContent = s.role;
  $("uptime").textContent = "up " + duration(s.uptime_seconds);
  renderAggregate(s);
  renderScheduler(s);
  renderPaths(s);
}

const FIELDS = [
  ["echo_interval_ms", "Report interval", "ms",
   "How often measurement feedback is sent. Bounds how quickly a change in a path can be noticed."],
  ["probe_interval_seconds", "MTU probe interval", "s",
   "How often path MTU is re-tested. It changes on tower handover and 5G-to-LTE fallback."],
  ["state_interval_ms", "State refresh", "ms",
   "How often the daemon writes the data this page reads."],
  ["stats_interval_seconds", "Log interval", "s",
   "How often measurements are written to the daemon log."],
  ["record_interval_seconds", "History interval", "s",
   "How often a snapshot is appended to the history log, which is what a drive leaves behind to look at afterwards."],
  ["record_max_megabytes", "History file size", "MB",
   "Size at which the history log rotates."],
  ["record_keep_files", "History files kept", "files",
   "How many rotated history files to keep. Size times count is the hard ceiling on disk."],

  ["eval_interval_ms", "Scheduler interval", "ms",
   "How often paths are re-judged. A degraded path stays selected for one of these, and that delay is audible."],
  ["unstable_loss_percent", "Unstable above loss", "%",
   "Recent loss that marks a path degraded. Judged against the path itself, not against other paths."],
  ["unstable_queue_delay_ms", "Unstable above queue delay", "ms",
   "Delay above the path's own rolling minimum that marks it degraded. This is what catches a carrier buffering seconds of traffic."],
  ["unstable_jitter_ms", "Unstable above jitter", "ms",
   "Interarrival jitter that marks a path degraded."],
  ["demote_intervals", "Intervals to demote", "intervals",
   "Consecutive breaching intervals before a path is called unstable. One bad measurement is a bad measurement, not a degraded link."],
  ["promote_intervals", "Intervals to promote", "intervals",
   "Consecutive clean intervals before a path is trusted again. Deliberately longer than demotion."],
  ["down_silence_ms", "Down after silence", "ms",
   "Silence before a path may be called down. Only counts alongside the probe count below, so an idle path is never declared dead."],
  ["down_probe_packets", "Down after unanswered", "packets",
   "How many packets must go unanswered, alongside the silence above, before a path is down."],
  ["flap_window_seconds", "Flap window", "s",
   "How far back state changes are counted when deciding a path is flapping."],
  ["flap_threshold", "Flap threshold", "changes",
   "State changes within the window before a path is treated as flapping. This is what stops an hour under tree cover becoming an hour of handovers."],
  ["flap_penalty_r", "Flap penalty", "R",
   "Score penalty for a flapping path. Roughly a whole MOS point at 15. Zero switches the penalty off."],
  ["unstable_penalty_r", "Unstable penalty", "R",
   "Score penalty for a degraded path, so a steady path wins when scores are close. Zero switches it off."],
  ["switch_margin_r", "Switch margin", "R",
   "How much better a challenger must score before it is even considered. Zero makes the scheduler move on any improvement."],
  ["min_acceptable_r", "Quality floor", "R",
   "Below this the current path is inadequate and the scheduler moves without waiting for the margin. 70 R is about 3.6 MOS."],
  ["switch_hold_intervals", "Switch hold", "intervals",
   "How long a challenger must stay better before the traffic actually moves. This is the stickiness."],
  ["base_delay_ms", "Base delay", "ms",
   "Mouth-to-ear delay the network is not responsible for: codec, the far end's buffer, and the hairpin through home."],
  ["mbb_min_ms", "Handover minimum overlap", "ms",
   "Shortest time both paths carry traffic during a handover."],
  ["mbb_max_ms", "Handover maximum overlap", "ms",
   "Longest to keep paying for two copies while waiting for the new path to be confirmed."],

  ["report_interval_ms", "Path report interval", "ms",
   "How often each end tells the other what it measured on the other's transmissions. This is the far end's only way to see its own send direction."],
  ["bw_onset_ms", "Capacity onset", "ms",
   "Queueing in the send direction that counts as the link starting to fill. The rate at that moment becomes the path's estimated ceiling."],
  ["bw_min_load_kbps", "Capacity minimum load", "kbps",
   "Below this a path is carrying too little for its behaviour to mean anything, and nothing is concluded either way. An idle path never sets a ceiling."],
  ["bw_headroom_percent", "Capacity headroom", "%",
   "Margin a path must have spare before traffic is steered onto it. Arriving exactly at the estimated ceiling is arriving at the wall."],
  ["bw_fallback_kbps", "Capacity if unmeasured", "kbps",
   "What a path is assumed to carry before it has ever been seen to queue. Zero means unknown, which applies no limit at all - set it only where a plan's ceiling is genuinely known, such as a 512k satellite standby tier."],
];

// The one setting that is not a number. Duplication is the difference
// between resilience and saturating a 512k link, so it is worth being able
// to change without editing a file.
const DUPLICATE_HINTS = {
  "off": "One copy, always. A handover becomes cut-then-connect, which is audible.",
  "switching": "One copy, except during a handover. The default.",
  "unstable": "Also duplicate while the chosen path is degraded. Costly until classification can limit this to real-time traffic.",
  "always": "Every packet on every usable path. This is what saturated the standby-plan link.",
};

async function loadConfig() {
  const r = await (await fetch("/api/config")).json();
  const modes = Object.keys(DUPLICATE_HINTS);
  const current = r.config.duplicate_mode || "switching";

  $("fields").innerHTML = FIELDS.map(([key, label, unit, hint]) => {
    const b = r.bounds[key] || {};
    return `<div class="field">
      <label for="${key}">${label}</label>
      <span><input type="number" id="${key}" name="${key}" value="${r.config[key]}"
        min="${b.Min}" max="${b.Max}" step="1"> <span class="muted">${unit}</span></span>
      <div class="hint">${hint} Range ${b.Min}–${b.Max}.</div>
    </div>`;
  }).join("") +
  `<div class="field">
     <label for="duplicate_mode">Duplication</label>
     <span><select id="duplicate_mode" name="duplicate_mode">
       ${modes.map(m => `<option value="${m}"${m === current ? " selected" : ""}>${m}</option>`).join("")}
     </select></span>
     <div class="hint" id="duplicate_hint">${DUPLICATE_HINTS[current]}</div>
   </div>`;

  $("duplicate_mode").addEventListener("change", e => {
    $("duplicate_hint").textContent = DUPLICATE_HINTS[e.target.value] || "";
  });
}

$("config").addEventListener("submit", async e => {
  e.preventDefault();
  const body = {};
  for (const [key] of FIELDS) body[key] = Number($(key).value);
  body.duplicate_mode = $("duplicate_mode").value;

  const res = await fetch("/api/config", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    alert("Could not save: " + await res.text());
    return;
  }
  // Re-read rather than trusting what was typed: values out of range come
  // back corrected, and the form should show what actually took effect.
  const r = await res.json();
  for (const [key] of FIELDS) $(key).value = r.config[key];
  $("duplicate_mode").value = r.config.duplicate_mode;
  $("saved").hidden = false;
  setTimeout(() => { $("saved").hidden = true; }, 2500);
});

async function loadLogs() {
  const r = await (await fetch("/api/logs")).json();
  const el = $("logs");
  el.textContent = (r.lines || []).join("\n");
  el.scrollTop = el.scrollHeight;
}

$("refresh-logs").addEventListener("click", loadLogs);

$("restart").addEventListener("click", async () => {
  if (!confirm("Restart the daemon? The tunnel drops for a moment.")) return;
  $("restart-note").textContent = "Restarting…";
  const res = await fetch("/api/restart", {method: "POST"});
  $("restart-note").textContent = res.ok ? "Restarted." : "Failed: " + await res.text();
  setTimeout(loadLogs, 1500);
});

refreshState();
loadConfig();
loadLogs();
setInterval(refreshState, 1000);
</script>
</body>
</html>
