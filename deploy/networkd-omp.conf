# /etc/systemd/networkd.conf.d/omp.conf (D-069)
#
# Leave routing policy rules networkd did not write alone. omp-tun-up adds
# an unreachable rule after each WireGuard transport's fwmark lookup, so a
# link that is down takes its tunnel down instead of letting it fall through
# into the tunnel over another link. networkd's default is to delete every
# rule it did not configure whenever it starts, which would remove that
# guard - and wg-quick's own rules - on nothing more than a networkd restart.
[Network]
ManageForeignRoutingPolicyRules=no
