# OpenMultiPath host tuning. Install to /etc/sysctl.d/99-omp-tuning.conf on
# both the vehicle and the home responder, then `sysctl --system`.
#
# The reason this exists (D-041): the tunnel's TCP upload collapsed to ~5 Mbps
# on a path a UDP flood proved could carry ~70. The cause was the default
# congestion control, cubic, treating the cellular uplink's ordinary random
# loss and jitter as congestion and backing off hard. BBR paces to its
# bandwidth*RTT estimate and ignores non-congestive loss, which is exactly the
# cellular case; on the vehicle it took a single-stream wg upload from 5.5 to
# 68.5 Mbps. fq gives BBR the pacing it wants; the larger buffers keep a
# high-bandwidth*delay path from stalling on a small window.
#
# This helps traffic that originates on these boxes and the daemon's own
# measurement flows. Traffic forwarded for a LAN client keeps that client's
# own congestion control end to end, so a cubic client still backs off - the
# lasting fix for that is masking path loss in the tunnel (FEC/duplication),
# which stays future work.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216
net.core.netdev_max_backlog = 5000
